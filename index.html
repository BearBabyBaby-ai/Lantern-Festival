<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>澎湖慶元宵‧乞龜祈福來</title>
<meta name="theme-color" content="#a8231b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--cream:#fff7ec;--paper:#fbf1df;--line:#ead9c2;--ink:#2a1a12;--muted:#6b5446;--red:#a8231b;--deep:#7a1712;--gold:#f2c46b;--goldink:#5c3a00;--goldsoft:#fcebc4;--font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;--serif:'Noto Serif TC','Noto Sans TC',serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
button,select,input{font-family:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--red);color:#fff}
.top img{width:44px;height:44px;flex:none;object-fit:contain}
.top .tt{min-width:0;display:flex;flex-direction:column;gap:1px}
.top .tt b{font-family:var(--serif);font-size:19px;font-weight:900;letter-spacing:.04em;white-space:nowrap}
.top .tt span{font-size:12px;color:#fce3d9}
.top nav{display:none;margin-left:auto;gap:6px}
.top nav button{border:0;border-radius:12px;padding:9px 18px;background:transparent;color:#fce3d9;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.top nav button.on{background:var(--goldsoft);color:var(--red)}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view{display:flex;flex-direction:column;gap:14px;padding:16px;max-width:1280px;margin:0 auto}
.bnav{flex:none;display:flex;gap:2px;align-items:center;padding:0 6px calc(6px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);height:calc(72px + env(safe-area-inset-bottom))}
.bnav button{flex:1;min-width:0;height:56px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bnav button.on{background:var(--goldsoft);color:var(--red);font-weight:700}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.banner{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px}
/* 月曆 */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head b{font-size:18px;font-weight:900}
.cal-head button{width:44px;height:44px;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;border-radius:22px}
.cal-head button:disabled{opacity:.25;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wk{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.cal .d{height:48px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--muted)}
.cal button.d{border:2px solid var(--gold);background:var(--goldsoft);color:var(--goldink);font-weight:900}
.cal button.d.on{border:0;background:var(--red);color:#fff}
.cal .d small{font-size:11px;font-weight:700}
/* 路線 */
.rsel-row{display:flex;flex-direction:column;gap:6px}
.rsel-row label{font-size:15px;font-weight:900;color:var(--deep)}
.rsel-row select{height:48px;padding:0 12px;border:1px solid var(--line);border-left:6px solid var(--rc,var(--red));border-radius:12px;background:#fff;color:var(--ink);font-size:16px;font-weight:700}
.rcard{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--rc,var(--red))}
.rcard .nm{font-size:22px;font-weight:900;color:var(--deep)}
.rcard .th{font-size:16px;font-weight:700;color:var(--muted)}
.rcard .stat{font-size:14px}
.rcard .dm{display:block;width:100%;height:auto;border-radius:10px;cursor:zoom-in}
.sec{display:flex;flex-direction:column}
.sec h3{margin:0;font-size:14px;font-weight:900;color:var(--deep);padding:6px 0;border-bottom:2px solid var(--gold)}
.stop{display:flex;align-items:stretch;gap:10px;padding:0;border:0;background:transparent;text-align:left;width:100%;color:inherit}
.stop .rail{flex:none;width:30px;display:flex;flex-direction:column;align-items:center}
.stop .rail i{width:2px;background:var(--line)}
.stop .rail i:first-child{height:10px}
.stop .rail i:last-child{flex:1}
.stop .no{width:28px;height:28px;border-radius:14px;background:#fff;color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--line)}
.stop.hot .no{background:var(--gold);color:var(--goldink);font-weight:900;border-color:var(--red)}
.stop .body{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f1e6d6}
.stop .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.stop .txt b{font-size:15px;font-weight:700}
.stop .txt span{font-size:12px;color:var(--muted)}
.stop .txt em{align-self:flex-start;font-style:normal;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;background:var(--goldsoft);color:var(--goldink)}
.stop img{flex:none;width:64px;height:48px;object-fit:cover;border-radius:8px}
.btn-line{height:44px;border:1.5px solid var(--red);border-radius:22px;background:#fff;color:var(--red);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.empty{padding:18px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:14px;color:var(--muted);text-align:center}
/* 詳細資訊 */
.sheet{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:rgba(42,26,18,.45)}
.sheet .box{width:100%;max-width:560px;max-height:82%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:18px 18px calc(22px + env(safe-area-inset-bottom));background:#fff;border-radius:20px 20px 0 0}
.sheet .hd{display:flex;align-items:center;gap:8px}
.sheet .hd b{font-size:20px;font-weight:900;color:var(--deep)}
.sheet .hd .tag{flex:none;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--gold);color:var(--goldink);font-weight:700}
.sheet .hd .x{margin-left:auto;width:44px;height:44px;flex:none;border:0;border-radius:22px;background:#f4ece1;color:var(--ink);display:flex;align-items:center;justify-content:center}
.sheet .pic{width:100%;height:200px;object-fit:cover;border-radius:12px}
.sheet .fields{border-top:1px solid var(--line)}
.sheet .fields div{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sheet .fields span{color:var(--muted)}
.sheet .fields .lx-box{display:flex;flex-direction:column;gap:4px}
.sheet .fields .lx-row{display:block;color:inherit}
.sheet .fields .lx-inline{display:flex;flex-wrap:wrap;gap:4px 12px}
.sheet .fields .lx{display:inline;color:var(--ink);border-radius:6px;padding:1px 4px;margin:0 -4px}
.sheet .fields .lx.off{color:#b8a99a}
.sheet .fields .lx.live{background:#fde4e1}
.lx-tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:8px;font-size:11px;font-style:normal;font-weight:700;vertical-align:1px}
.lx-tag.gray{background:#ece6de;color:#8a7d70}
.lx-tag.red{background:#d8392f;color:#fff}
.sheet .nav{height:48px;border:0;border-radius:24px;background:var(--red);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.zoom{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;overflow:auto}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}
.zoom .x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border:0;border-radius:22px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center}
.rmap{position:fixed;inset:0;z-index:1050;display:flex;flex-direction:column;background:#fff}
.rmap .bar{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--red);color:#fff}
.rmap .bar b{font-size:17px}
.rmap .bar button{margin-left:auto;width:40px;height:40px;border:0;border-radius:20px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center}
.rmap #rmapBox{flex:1;position:relative}
.g-card{position:absolute;z-index:1000;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#0b3954;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.g-card .gi{flex:none;width:44px;height:44px;display:grid;place-items:center}
.g-card .gi svg{width:40px;height:40px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.g-card .gt{display:flex;flex-direction:column;gap:2px;min-width:0}
.g-card .gt b{font-size:22px;line-height:1.25}
.g-card .gt span{font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmap.guiding .leaflet-control-zoom{display:none}
.g-bar{flex:none;display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.g-bar button{flex:1 1 0;min-width:0;height:46px;border:0;border-radius:12px;background:var(--red);color:#fff;font:700 15px/1 var(--font);white-space:nowrap}
.g-bar button[data-g="gmap"],.g-bar button[data-g="voice"]{background:#fff;color:var(--red);border:2px solid var(--red)}
.g-me i{position:absolute;inset:0;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25),0 1px 4px rgba(0,0,0,.4)}
.pin{width:26px;height:26px;border-radius:13px;background:#fff;border:2px solid var(--line);color:var(--muted);font:700 11px/22px var(--font);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.leaflet-tooltip.pin-name{padding:1px 6px;border-radius:6px;font:700 12px/1.4 var(--font);color:var(--ink);background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.leaflet-tooltip.pin-name::before{display:none}
.leaflet-tooltip.pin-name.hide{visibility:hidden}
.pin-icon{border:none;background:none}
.pin-icon .pin-dot{position:absolute;inset:0;display:grid;place-items:center;color:white;background:var(--pin);border:2px solid white;border-radius:50%;font-size:10px;font-weight:850;line-height:1;box-shadow:0 1px 5px #173a3b60}
.pin-icon.route-pin .pin-dot{--pin:#0b3954;font-size:11px}
.route-arrow{background:none;border:none;pointer-events:none}
.route-arrow svg{width:18px;height:18px;fill:#fff;stroke:#0b3954;stroke-width:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.pin.hot{background:var(--gold);border-color:var(--red);color:var(--goldink)}
/* 地圖 */
.mq{-webkit-appearance:none;appearance:none;flex:none;height:50px;padding:0 16px;border:1px solid #cfe4ea;border-radius:14px;background:#fff;font-size:16px;color:var(--ink);width:100%}
.mr{display:flex;align-items:center;gap:12px}
.mr label{flex:none;font-size:16px;font-weight:900;color:#0b3954}
.mr select{flex:1;min-width:0;height:46px;padding:0 12px;border:1px solid #cfe4ea;border-radius:12px;background:#fff;font-size:16px;font-weight:700;color:var(--ink)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cats button{min-width:0;height:48px;padding:0 4px;border:2px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--fg);font-size:16px;font-weight:900;white-space:nowrap}
.map-routes{display:flex;flex-direction:column;gap:14px}
.cats button.on{background:var(--fg);border-color:var(--fg);color:#fff}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{display:flex;flex-direction:column;min-width:0;padding:0;text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(7,43,75,.08);color:inherit}
.card .ph{position:relative;display:block;width:100%;height:120px;overflow:hidden;background:#f4ece1}
.card .ph img{display:block;width:100%;height:100%;object-fit:cover}
.card .ph span{position:absolute;left:7px;top:7px;font-size:11px;font-weight:900;border-radius:999px;padding:2px 7px;background:#fff;color:var(--cc)}
.card .tx{display:flex;flex-direction:column;gap:3px;padding:8px 9px 9px;min-width:0}
.card .tx b{font-size:14px;line-height:1.35;color:#102a43}
.card .tx small{font-size:12px;color:var(--muted)}
.card .tx small.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tx small.f{color:#7c2d12}
.more{height:1px}
.map-wrap{display:flex;flex-direction:column;gap:14px}
#mapBox{display:none}
/* 集章 */
#v-stamp{padding:0;max-width:none;height:100%}
#stampFrame{display:block;width:100%;height:100%;border:0;background:#fff7ec}
/* 潮汐（照熊寶系統手機端） */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;margin:2px 2px 0}
.page-head h2{margin:0;font-size:1.3rem;color:#0b3954;letter-spacing:.03em}
.page-head p{margin:0;color:#5b7480;font-size:.86rem}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.75);border:1px solid #d6e4e9;border-radius:14px;padding:4px;box-shadow:0 2px 8px rgba(7,43,75,.06);flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 4px;font-weight:900;color:#3d5a66;font-size:.84rem;white-space:nowrap}
.seg button.active{background:#0b3954;color:#fff;box-shadow:0 3px 10px rgba(11,57,84,.25)}
.tide-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:#fff;border:1px solid #d3e3e8;border-left:5px solid #0b3954;border-radius:14px;padding:12px 14px;margin:4px 0 10px;box-shadow:0 4px 14px rgba(11,57,84,.07);font-size:.9rem;font-weight:800;color:#0b3954}
.tide-toolbar select{border:1px solid #9fc3cf;border-radius:8px;padding:8px 10px;background:#f7fbfc;color:#0b3954;font-weight:800}
.tide-status{font-size:.82rem;color:#4a6572;font-weight:700;margin:6px 3px 10px}
.tide-status:empty{display:none}
.tide-days{display:grid;gap:10px}
.tide-card{background:#fff;border:1px solid #d6e4e9;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px rgba(11,57,84,.06)}
.tide-card[open]{border-color:#0b3954;box-shadow:0 8px 22px rgba(11,57,84,.14)}
.tide-card summary{list-style:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 16px;cursor:pointer}
.tide-card[open] summary{padding:14px 16px;background:linear-gradient(90deg,#eef6f8,#fff);border-bottom:1px solid #dbe8ec}
.tide-card summary::-webkit-details-marker{display:none}
.tide-card summary>span:first-child{min-width:0}
.tide-card summary strong{display:block;font-size:1rem;line-height:1.35;color:#0b3954;letter-spacing:.02em}
.tide-brief{display:flex;flex-wrap:wrap;gap:0 10px;margin-top:5px;font-size:.86rem;line-height:1.5}
.tide-brief .sep,.tide-item.sep{color:#2563eb!important}
.tide-brief .mer,.tide-item.mer{color:#ef1d2f!important}
.tide-card .chevron{font-size:1.1rem;color:#0f8d96;transition:transform .2s;padding-top:1px}
.tide-card[open] .chevron{transform:rotate(180deg)}
.tide-detail{padding:13px 16px 16px;background:#fff}
.sun-row{display:block;background:linear-gradient(90deg,#fff7e6,#fff1d6);border:1px solid #f6dcae;border-radius:10px;padding:9px 10px;margin-bottom:14px;color:#8a4b08;font-weight:700;font-size:.84rem}
.tide-label{display:flex;align-items:center;gap:7px;color:#0b3954;font-size:.8rem;font-weight:800;border-bottom:1px solid #e3edf0;padding-bottom:5px;margin:11px 0 7px}
.tide-label::before{content:"";width:4px;height:13px;border-radius:2px;background:#0f8d96}
.tide-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.tide-item{display:flex;justify-content:space-between;align-items:center;min-height:37px;padding:7px 10px;background:#f7f9fb;border-left:3px solid currentColor;border-radius:8px;box-shadow:inset 0 0 0 1px #e8eef1;font-size:.85rem}
.tide-item.hi{color:#ff3b45}.tide-item.lo{color:#2788ee}.tide-item strong{font-weight:800}
.safety-list{display:flex;flex-wrap:wrap;gap:7px;background:#ecfdf5;border-left:4px solid #10b981;border-radius:9px;padding:9px 10px;color:#065f46;font-size:.86rem}
.safety-list span{font-weight:700}
.safety-list span+span:before{content:'│';color:#6ee7b7;margin-right:7px}
.forecast-list{display:grid;gap:8px}
.f-card{background:#fff;border-radius:8px;padding:10px 12px;cursor:pointer;border:1px solid #e2e8f0;transition:all .2s ease;position:relative}
.f-card.active{border:2px solid #900;background:#fffcfc}
.f-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:1.05rem;font-weight:800;color:#1e293b}
.f-card-note{font-size:.82rem;color:#64748b;margin-bottom:4px}
.f-tide-container{margin-top:8px;display:none;border-top:1px solid #eee;padding-top:8px}
.f-card.active .f-tide-container{display:block}
.f-tide-row{display:grid;grid-template-columns:60px 80px 1fr 40px;align-items:center;padding:7px 12px;margin-bottom:5px;background:#f8fafc;border-radius:4px;font-size:1rem}
.f-tide-row.high{border-left:5px solid #d32f2f;color:#d32f2f}
.f-tide-row.low{border-left:5px solid #1976d2;color:#1976d2}
.f-status-tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.f-status-tags:empty{display:none}
.f-tag-pill{color:#fff;padding:4px 12px;border-radius:15px;font-size:.85rem;font-weight:bold}
.f-bg-mer{background-color:#ef4444}.f-bg-sep{background-color:#3b82f6}
.f-card-pool{margin-top:8px;padding:9px 10px;background:#fefce8;border-left:4px solid #eab308;border-radius:9px;color:#713f12;font-size:.9rem;font-weight:800;line-height:1.7}.f-card-pool b{display:block;color:#a16207;font-size:.82rem}.f-card-pool i{font-style:normal;white-space:nowrap}
.wx-now{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;align-items:center;background:#fff;border:1px solid #d6e4e9;border-radius:18px;padding:14px 16px;box-shadow:0 8px 22px rgba(7,43,75,.08);margin-bottom:12px}
.wx-now .ic{font-size:2.6rem;line-height:1;grid-row:span 2;width:auto;height:auto}
.wx-now b{font-size:1.15rem;color:#0b3954}
.wx-now p{margin:0;color:#475569;font-size:.86rem;line-height:1.6}
.wx-badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:900;margin-left:6px;vertical-align:middle}
.wx-badge.ok{background:#dcfce7;color:#15803d}.wx-badge.warn{background:#fef3c7;color:#b45309}.wx-badge.bad{background:#fee2e2;color:#b91c1c}
.wx-hours{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px}
.wx-h{flex:0 0 86px;background:#fff;border:1px solid #d6e4e9;border-radius:14px;padding:8px 6px;text-align:center;font-size:.78rem;color:#334155}
.wx-h b{display:block;font-size:.84rem;color:#0b3954}
.wx-h i{display:block;font-style:normal;font-size:1.3rem;margin:2px 0}
.wx-days{display:grid;gap:8px}
.wx-day{display:grid;grid-template-columns:60px 30px minmax(0,1fr);gap:10px;align-items:center;background:#fff;border:1px solid #d6e4e9;border-radius:14px;padding:10px 12px;box-shadow:0 3px 10px rgba(7,43,75,.05);font-size:.84rem}

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clean = v => String(v ?? '').trim();
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const weekdayOf = k => { const [y, m, d] = k.split('/').map(Number); return new Date(y, m - 1, d).getDay(); };
const SHEET_ID = '1LOr4_3ugTHvTIi4UIfgVz2atVFh2K32zh7YKrrHxTwk';
const GIDS = { food: '1582663006', spot: '2085392869', temple: '2137991614', tide: '1122135459', forecast: '776158339' };
const SHEET_NAMES = { food: '美食清單', spot: '景點', temple: '廟宇' };
/* 配合單位只寫單位名稱時，對應的活動 */
const GOV_ACT = { '文化局': '2027超級龜龜' };
const IC = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  map: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  stamp: '<path d="M9.5 3.5h5v3.2c0 1.6 1.3 2.3 1.3 4.3H8.2c0-2 1.3-2.7 1.3-4.3z"/><rect x="4.5" y="11" width="15" height="4" rx="1.2"/><path d="M4 20.5h16"/>',
  tide: '<path d="M2 10c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M2 15.5c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M2 21c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0"/>',
  nav: '<path d="M3 11 21 3l-8 18-2-8z"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>'
};
const svg = (k, s = 22) => `<svg class="ic" viewBox="0 0 24 24" style="width:${s}px;height:${s}px">${IC[k]}</svg>`;

/* ---------- 顯示期間：2026/11/19～2027/03/15 ---------- */
const SHOW_FROM = '2026/11/19', SHOW_TO = '2027/03/15';
const taipeiToday = () => new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).replace(/-/g, '/');
const IS_PC = /Electron/i.test(navigator.userAgent) || !/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
function checkWindow() {
  const t = taipeiToday(), out = t < SHOW_FROM || t > SHOW_TO;
  $('offwin').hidden = !out; $('app').hidden = out;
  $('offMsg').textContent = IS_PC ? '非活動期間 請關閉' : '非活動期間 請移除此APP';
  return !out;
}

/* ---------- 分頁 ---------- */
/* 集章只在手機端；電腦端沒有集章 */
const TABS = [['home', '首頁'], ['map', '地圖'], ...(IS_PC ? [] : [['stamp', '集章']]), ['tide', '潮汐']];
let currentView = 'home';
const navHtml = () => TABS.map(([k, n]) => `<button type="button" data-v="${k}">${svg(k === 'stamp' ? 'stamp' : k, 22)}<span>${n}</span></button>`).join('');
$('topNav').innerHTML = navHtml(); $('bNav').innerHTML = navHtml();
function showView(v, push = true) {
  if (!TABS.some(t => t[0] === v)) v = 'home';
  currentView = v;
  ['home', 'map', 'stamp', 'tide'].forEach(k => { $('v-' + k).hidden = k !== v; });
  document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('main').scrollTop = 0;
  if (push) history.pushState({ v }, '');
  if (v === 'map') MapView.show();
  if (v === 'stamp') loadStamp();
  if (v === 'tide') { loadTideData(); if (tideMode === 'forecast') onForecastShown(); if (tideMode === 'wx') Wx.render(); }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) showView(b.dataset.v); });

/* ---------- 共用：試算表讀取 ---------- */
function sheetUrl(name) { return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`; }
async function loadRows(key) {
  const res = await fetch(sheetUrl(SHEET_NAMES[key]), { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return Papa.parse(await res.text(), { header: true, skipEmptyLines: true }).data;
}
const driveId = u => (String(u || '').match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=|thumbnail\?id=)([\w-]{20,})/) || [])[1] || '';
const picUrl = (id, w = 640) => id ? `https://lh3.googleusercontent.com/d/${id}=w${w}` : '';
const num = v => { const n = parseFloat(String(v || '').replace(/,/g, '')); return Number.isFinite(n) ? n : null; };
const navUrl = o => (o.lat != null && o.lng != null) ? `https://www.google.com/maps/dir/?api=1&destination=${o.lat},${o.lng}` : (o.mapUrl || (o.addr ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.addr)}` : ''));
const normDate = s => { const m = String(s || '').match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/); return m ? `${m[1]}/${m[2].padStart(2, '0')}/${m[3].padStart(2, '0')}` : ''; };
function datesOf(range) {
  const all = String(range || '').match(/\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/g) || [];
  if (!all.length) return [];
  const a = normDate(all[0]), b = normDate(all[all.length - 1]), out = [];
  const d = new Date(a.replace(/\//g, '-') + 'T00:00:00'), end = new Date(b.replace(/\//g, '-') + 'T00:00:00');
  for (let i = 0; d <= end && i < 120; i++) { out.push(`${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`); d.setDate(d.getDate() + 1); }
  return out;
}
const rangeText = days => { if (!days.length) return ''; const a = days[0], b = days[days.length - 1]; return a === b ? a : `${a}－${a.slice(0, 4) === b.slice(0, 4) ? b.slice(5) : b}`; };

/* ---------- 排除離島；元宵期間望安、七美不顯示 ---------- */
const HIDE_TOWN = ['望安鄉', '七美鄉'];
const ISLAND = /吉貝|鳥嶼|員貝|目斗|姑婆|澎澎灘|大倉|桶盤|虎井/;
const keepPlace = o => !!o && !HIDE_TOWN.includes(o.town) && !ISLAND.test([o.vil, o.name, o.addr].join(' '));

/* ---------- 廟宇資料 ---------- */
const TEMPLES = {};   /* 廟宇鍵（名稱＠座標）→ 資料；同名廟宇用座標區分 */
let byDay = {};       /* 日期 → 活動廟宇鍵 */
const tkOf = r => `${clean(r['廟宇名稱'])}@${clean(r.Latitude)},${clean(r.Longitude)}`;
/* 新增廟宇：用名稱找（同名時取有元宵日期的那間） */
const extraKey = x => { const hit = Object.values(TEMPLES).filter(t => t.name === x.name); return ((hit.find(t => t.days.length) || hit[0]) || {}).key || ''; };
/* ---------- 元宵活動內容：細項解析 ----------
   各項用「、」「|」「│」「｜」隔開；日期、星期列表裡的「、」不算分項（去掉開頭日期、時間後沒有文字的片段併到下一段）。
   每項開頭可寫日期（單日、期間、民國年、期間＋星期）、時間（HH:MM 或 HH:MM-HH:MM），也可以都不寫。 */
const LX = (() => {
  const SEP = '(?:-|－|—|~|～|至|到)';
  const D = '\\d{4}\\/\\d{1,2}\\/\\d{1,2}';
  const DATE_TOK = new RegExp(`^(${D})(?:\\s*${SEP}\\s*(${D}|\\d{1,2}\\/\\d{1,2}))?`);
  const WEEK_TOK = /^(?:週|周|星期|禮拜)([一二三四五六日天])(?:\s*[、,，]\s*(?:週|周|星期|禮拜)?([一二三四五六日天]))*/;
  const TIME_TOK = new RegExp(`^(\\d{1,2}:\\d{2})(?:\\s*${SEP}\\s*(\\d{1,2}:\\d{2}))?`);
  const WD = { 日: 0, 天: 0, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6 };
  const norm = v => String(v ?? '').replace(/：/g, ':').replace(/／/g, '/')
    .replace(/(^|[^\d])(1\d{2})\/(\d{1,2})\/(\d{1,2})/g, (m, p, y, mo, d) => `${p}${Number(y) + 1911}/${mo}/${d}`);
  const pad = d => { const [y, m, dd] = d.split('/').map(Number); return `${y}/${String(m).padStart(2, '0')}/${String(dd).padStart(2, '0')}`; };
  const span = (a, b) => { const out = [], d = new Date(a.replace(/\//g, '-') + 'T00:00:00'), e = new Date(b.replace(/\//g, '-') + 'T00:00:00'); for (let i = 0; d <= e && i < 400; i++) { out.push(`${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`); d.setDate(d.getDate() + 1); } return out; };
  const wdOf = k => { const [y, m, d] = k.split('/').map(Number); return new Date(y, m - 1, d).getDay(); };
  /* 讀掉開頭的日期、星期、時間，回傳細項 */
  function head(text) {
    let rest = norm(text).trim();
    const it = { dates: [], ranges: [], weeks: [], start: '', end: '' };
    for (let guard = 0; guard < 20; guard++) {
      rest = rest.replace(/^[\s、,，]+/, '');
      let m;
      if ((m = rest.match(DATE_TOK))) {
        const a = pad(m[1]);
        if (m[2]) { const b = pad(m[2].split('/').length === 2 ? `${a.slice(0, 4)}/${m[2]}` : m[2]); it.ranges.push([a, b]); } else it.dates.push(a);
        rest = rest.slice(m[0].length); continue;
      }
      if ((m = rest.match(WEEK_TOK))) { (m[0].match(/[一二三四五六日天]/g) || []).forEach(c => it.weeks.push(WD[c])); rest = rest.slice(m[0].length); continue; }
      if ((m = rest.match(TIME_TOK))) { it.start = m[1].padStart(5, '0'); it.end = m[2] ? m[2].padStart(5, '0') : ''; rest = rest.slice(m[0].length); continue; }
      break;
    }
    it.name = rest.trim();
    return it;
  }
  function parse(content) {
    const parts = String(content || '').split(/[、|│｜]/);
    const items = []; let buf = '';
    parts.forEach(p => {
      const cur = buf ? `${buf}、${p}` : p;
      if (head(cur).name) { items.push(head(cur)); buf = ''; } else buf = cur;
    });
    return items;
  }
  /* 細項的日子（null＝沿用整體期間每天） */
  function ownDays(it) {
    if (!it.dates.length && !it.ranges.length) return null;
    const set = new Set(it.dates);
    it.ranges.forEach(([a, b]) => span(a, b).forEach(d => set.add(d)));
    return [...set].sort();
  }
  function dayLabel(it) {
    const md = d => d.slice(5);
    const ds = [...it.dates.map(md), ...it.ranges.map(([a, b]) => `${md(a)}-${md(b)}`)];
    const W = '日一二三四五六';
    const ws = [...new Set(it.weeks)].map(w => '週' + W[w]).join('、');
    return [ds.join('、'), ws].filter(Boolean).join(' ');
  }
  const timeLabel = it => it.start ? (it.end ? `${it.start}-${it.end}` : it.start) : '';
  return { parse, ownDays, dayLabel, timeLabel, span, wdOf, norm, pad };
})();

function buildTemple(r) {
  const name = clean(r['廟宇名稱']); if (!name) return null;
  const base = datesOf(LX.norm(r['元宵活動日期範圍(YYYY/MM/DD-YYYY/MM/DD)']));
  const items = LX.parse(r['元宵活動內容']);
  /* 整體期間：細項日期超出時，延長到細項的最早／最晚那天 */
  const own = items.map(LX.ownDays).filter(Boolean).flat();
  let days = base;
  if (own.length) {
    const all = [...base, ...own].sort();
    days = LX.span(all[0], all[all.length - 1]);
  }
  items.forEach(it => {
    const d = LX.ownDays(it) || days;
    it.days = it.weeks.length ? d.filter(k => it.weeks.includes(LX.wdOf(k))) : d;
  });
  /* 配合單位：「單位-活動」，兩個以上用「、」隔開；活動內容裡屬於配合單位的活動，移到配合單位後面 */
  const govs = clean(r['參加政府單位活動(澎管處、文化局)']).split(/[、,，|｜│]/).map(x => x.trim()).filter(Boolean).map(x => {
    const m = x.match(/^([^-－]+)[-－](.+)$/);
    return m ? { unit: m[1].trim(), act: m[2].trim() } : { unit: x, act: GOV_ACT[x] || '' };
  });
  govs.forEach(g => {
    const it = g.act && items.find(i => i.name === g.act);
    g.days = it ? it.days : days;
    if (it) items.splice(items.indexOf(it), 1);
  });
  const gov = govs.map(g => g.act ? g.unit + '-' + g.act : g.unit).join('、');
  return { kind: 'temple', key: tkOf(r), name, town: clean(r['區域(鄉市)']), vil: clean(r['區域(村里)']), deity: clean(r['主祀']), addr: clean(r['地址']), tel: clean(r['電話']),
    lat: num(r.Latitude), lng: num(r.Longitude), pic: driveId(r['圖資來源']), mapUrl: clean(r['完整網址']) || clean(r['短網址']),
    days, time: clean(r['元宵活動時間']), content: clean(r['元宵活動內容']), items, gov, govs,
    history: clean(r['廟宇史蹟']), legend: clean(r['傳說']) };
}
/* 時間軸小標：當天的活動內容細項＋配合單位活動 */
function todayActs(t, day) {
  return [...t.items.filter(it => it.days.includes(day)).map(it => it.name), ...t.govs.filter(g => g.act && g.days.includes(day)).map(g => g.unit + '-' + g.act)].join('、');
}
/* 現在（台灣時間）是否在細項的時段內 */

  const MA = a => `https://marine-api.open-meteo.com/v1/marine?latitude=${a.sea[0]}&longitude=${a.sea[1]}&timezone=Asia%2FTaipei&forecast_days=7&hourly=wave_height&daily=wave_height_max`;
  let fc = null, ma = null, loading = null, error = '';
  const DIRS = ['北', '東北', '東', '東南', '南', '西南', '西', '西北'];
  const dirOf = d => DIRS[Math.round((((Number(d) || 0) % 360) + 360) % 360 / 45) % 8];
  const LIM = [0.3, 1.6, 3.4, 5.5, 8.0, 10.8, 13.9, 17.2, 20.8, 24.5, 28.5, 32.7];
  const bft = ms => { const i = LIM.findIndex(x => ms < x); return i < 0 ? 12 : i; };
  const ICON = c => c === 0 ? ['☀️', '晴'] : c <= 2 ? ['🌤️', '晴時多雲'] : c === 3 ? ['☁️', '陰'] : c <= 48 ? ['🌫️', '有霧'] : c <= 57 ? ['🌦️', '毛毛雨'] : c <= 67 ? ['🌧️', '雨'] : c <= 77 ? ['🌨️', '雪'] : c <= 82 ? ['🌦️', '陣雨'] : ['⛈️', '雷雨'];
  const waveTxt = h => h == null ? '—' : h < 0.5 ? '平穩' : h < 1.25 ? '小浪' : h < 2.5 ? '中浪' : h < 4 ? '大浪' : '巨浪';
  function risk(windMs, gustMs, wave) {
    const w = bft(windMs), g = bft(gustMs);
    if (w >= 6 || g >= 8 || (wave ?? 0) >= 2.5) return ['bad', '風浪大・不宜出海'];
    if (w >= 5 || g >= 7 || (wave ?? 0) >= 1.25) return ['warn', '注意風浪'];
    return ['ok', '適合出海'];
  }
  async function getJSON(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }
  let req = 0;
  function load(force = false) {
    if (loading && !force) return loading;
    const my = ++req, a = AREAS[area];
    loading = (async () => {
      const [x, y] = await Promise.allSettled([getJSON(FC(a)), getJSON(MA(a))]);
      if (my !== req) return;
      if (x.status === 'fulfilled') { fc = x.value; error = ''; } else { fc = null; error = '天氣資料讀取失敗，請稍後再試'; }
      ma = y.status === 'fulfilled' ? y.value : null;
      render();
    })();
    return loading;
  }
  function setArea(v) { if (!AREAS[v]) return; area = v; lsSet('lf.wxArea', v); fc = null; ma = null; render(); load(true); }
  const picker = () => `<div class="tide-toolbar"><label for="wxArea">區域（鄉市）</label><select id="wxArea">${Object.keys(AREAS).map(k => `<option${k === area ? ' selected' : ''}>${k}</option>`).join('')}</select></div>`;
  const nowIdx = () => { if (!fc) return 0; const k = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hour12: false }).format(new Date()).replace(' ', 'T').slice(0, 13); const i = fc.hourly.time.findIndex(t => t.slice(0, 13) === k); return i < 0 ? 0 : i; };
  const waveAt = t => { if (!ma?.hourly) return null; const i = ma.hourly.time.indexOf(t); return i < 0 ? null : ma.hourly.wave_height[i]; };
  function nowHtml() {
    const H = fc.hourly, i = nowIdx(), [ic, tx] = ICON(H.weather_code[i]);
    const wave = waveAt(H.time[i]), [rc, rt] = risk(H.wind_speed_10m[i], H.wind_gusts_10m[i], wave);
    return `<div class="wx-now"><span class="ic">${ic}</span><b>現在 ${Math.round(H.temperature_2m[i])}°C・${tx}<span class="wx-badge ${rc}">${rt}</span></b>
      <p>💨 ${dirOf(H.wind_direction_10m[i])}風 ${bft(H.wind_speed_10m[i])} 級（${H.wind_speed_10m[i].toFixed(1)} m/s）・陣風 ${bft(H.wind_gusts_10m[i])} 級　🌊 浪高 ${wave == null ? '—' : `${wave.toFixed(1)} m（${waveTxt(wave)}）`}　☔ 降雨 ${H.precipitation_probability[i] ?? '—'}%</p></div>`;
  }
  function render() {
    const box = $('wxPane');
    if (!fc) { box.innerHTML = `${picker()}<div class="xb-empty">${error ? esc(error) : `正在讀取${area}風浪天氣…`}</div>`; load(); return; }
    const H = fc.hourly, D = fc.daily, i0 = nowIdx();
    const hours = [];
    for (let i = i0; i < Math.min(H.time.length, i0 + 25); i += 3) {
      const wave = waveAt(H.time[i]);
      hours.push(`<div class="wx-h"><b>${H.time[i].slice(11, 16)}</b><i>${ICON(H.weather_code[i])[0]}</i>${Math.round(H.temperature_2m[i])}°<br>${dirOf(H.wind_direction_10m[i])}風 ${bft(H.wind_speed_10m[i])} 級<br>陣風 ${bft(H.wind_gusts_10m[i])} 級<br>浪 ${wave == null ? '—' : wave.toFixed(1) + 'm'}</div>`);
    }
    const days = D.time.map((t, i) => {
      const k = t.replace(/-/g, '/'), [ic, tx] = ICON(D.weather_code[i]);
      const wave = ma?.daily?.wave_height_max?.[i] ?? null, [rc, rt] = risk(D.wind_speed_10m_max[i], D.wind_gusts_10m_max[i], wave);
      return `<div class="wx-day"><span class="d"><b>${i === 0 ? '今天' : i === 1 ? '明天' : `${Number(k.slice(5, 7))}/${Number(k.slice(8))}`}</b><small>星期${WEEK[weekdayOf(k)]}</small></span><span class="ic">${ic}</span>
        <span class="m">${tx}・${Math.round(D.temperature_2m_min[i])}～${Math.round(D.temperature_2m_max[i])}°C・☔ ${D.precipitation_probability_max[i] ?? '—'}%<br>💨 ${dirOf(D.wind_direction_10m_dominant[i])}風 最大 ${bft(D.wind_speed_10m_max[i])} 級・陣風 ${bft(D.wind_gusts_10m_max[i])} 級　🌊 浪高 ${wave == null ? '—' : `${wave.toFixed(1)} m（${waveTxt(wave)}）`}</span>
        <span class="wx-badge ${rc}">${rt}</span></div>`;
    }).join('');
    box.innerHTML = `${picker()}${nowHtml()}<div class="tide-label">${area}・未來 24 小時（每 3 小時）</div><div class="wx-hours">${hours.join('')}</div><div class="tide-label">未來 7 天</div><div class="wx-days">${days}</div>`;
  }
  document.addEventListener('change', e => { if (e.target.id === 'wxArea') setArea(e.target.value); });
  return { render, load };
})();

/* ---------- 啟動 ---------- */
if (checkWindow()) {
  history.replaceState({ v: 'home' }, '');
  showView('home', false);
  Home.render();
  loadTemples();
}
setInterval(checkWindow, 60000);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
