html,body{background:linear-gradient(180deg,#d7efff 0%,#f4fbff 45%,#fff3e2 100%) fixed;background-color:var(--sand)}
body{color:var(--navy);font-family:var(--f-game);line-height:1.55}
.wrap{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:14px}

.screen{position:relative;display:flex;flex-direction:column;gap:10px;padding-block:12px 16px;background:linear-gradient(180deg,var(--sky) 0%,var(--sand) 100%);border-radius:26px;border:3px solid #fff;box-shadow:0 14px 34px rgba(30,90,130,.22),inset 0 0 0 1px #cfe8f6;overflow:hidden}
.screen button{font:inherit;cursor:pointer;color:inherit}
.screen button:focus-visible{outline:3px solid #ffcf3f;outline-offset:2px}

.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;padding-inline:14px;gap:8px 10px}
.gtitle{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;letter-spacing:.04em;white-space:nowrap;flex:0 0 auto}
.top-r{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.gtitle img{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px rgba(29,53,87,.2)}
.gtitle span{background:linear-gradient(90deg,#a8231b,#c9962e);-webkit-background-clip:text;background-clip:text;color:transparent}
.prog{font-size:12.5px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:1px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:8px;padding-inline:12px}
.tabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 0;font-size:15px;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.tabs button small{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"]{background:var(--c);border-color:#fff;color:#fff;box-shadow:0 4px 10px rgba(29,53,87,.22)}
/* 底色跟著所選分類換色：景點藍、美食橘、廟宇紅、集章冊珊瑚 */
html,body{background:linear-gradient(180deg,var(--t1,#d7efff) 0%,var(--t2,#f4fbff) 45%,#fff3e2 100%) fixed}
.screen{background:linear-gradient(180deg,var(--t1,#e7f6ff) 0%,var(--sand) 100%)}
.checkin{background:linear-gradient(180deg,var(--t1,#e7f6ff) 0%,var(--sand) 100%)}
/* 列表照片（有圖資來源才顯示） */
.thumb{display:block;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#e8f1f5}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
/* 打卡畫面的資訊（美食、廟宇） */
.ci-info{margin-inline:14px}
.ci-info .ibox{display:block;background:#fff}
.tabs button[aria-selected="true"] small{opacity:.9}

/* info cards: list of places in the chosen category; tapping one opens its check-in view */
.cards{display:flex;flex-direction:column;gap:12px;padding-inline:12px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:#fff;border:1.5px solid #e9a66c;border-left:7px solid var(--bar);border-radius:14px;padding:12px 14px 14px;font-family:"Noto Sans TC",sans-serif;box-shadow:0 2px 8px rgba(29,53,87,.08);transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(29,53,87,.14)}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-tt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0;flex:1 1 auto}
.card-tt b{overflow-wrap:anywhere}
.card-hd b{font-size:16.5px;line-height:1.3;color:var(--navy)}
.badge{flex:0 0 auto;font-size:11.5px;font-weight:700;color:#8a4a12;background:#fde7cf;border:1px solid #f3c597;border-radius:7px;padding:0 7px;white-space:nowrap}
.check{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:5px;border:2px solid #9bb8c6;background:#fff;display:grid;place-items:center;color:#fff;font-size:14px;line-height:1}
.card.done .check{background:#17708a;border-color:#17708a}
.meta{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12.5px;color:#4a5d68;padding-bottom:8px;border-bottom:1px solid #e6eef2}
.meta span+span::before{content:"|";color:#c3d1d8;margin-right:8px}
.ibox{background:#f6fafc;border:1px solid #dbe8ef;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.75;color:#33474f;overflow-wrap:anywhere}
.ibox strong{display:block;font-size:12.5px;color:var(--navy);margin-bottom:2px}
.card{cursor:pointer;box-sizing:border-box}
.more{height:1px}
.card-ft{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.card-ft{flex-wrap:nowrap;justify-content:flex-start}
.card-ft .nav{margin-left:auto;flex:1 1 0;width:auto;max-width:50%;min-width:0;padding:0 10px;box-sizing:border-box}
.card-ft .dist{flex:1 1 0;min-width:0;justify-content:center;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;min-height:36px;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:#17594a;background:#e3f6ec;border:1px solid #bfe5cf;border-radius:999px;padding:4px 11px;white-space:nowrap}
.card-ft .dist.far{color:#4a5d68;background:#eef3f6;border-color:#d7e2e8}
.nav{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:36px;min-width:118px;padding:0 22px;border-radius:999px;border:1.5px solid #17708a;color:#17708a;background:#eef8fb;font-size:13px;font-weight:700;text-decoration:none}
.nav:active{background:#d7eff5}
.nav:focus-visible{outline:3px solid #ffcf3f;outline-offset:2px}
.screen .card-open{flex:0 0 auto;display:inline-flex;align-items:center;gap:2px;border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap;letter-spacing:.04em;color:#fff!important;background:linear-gradient(180deg,#ff8a6a,#ff5e57);box-shadow:0 3px 0 var(--coral-d),0 6px 12px rgba(255,94,87,.22)}
.screen .card-open:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coral-d)}
.screen .card.done .card-open{color:var(--ok)!important;background:var(--ok-bg);box-shadow:0 3px 0 #a4d4b8}

/* check-in view: slides over the list inside the game screen */
.checkin{position:fixed;inset:0;margin-inline:auto;max-width:440px;z-index:50;display:flex;flex-direction:column;gap:10px;padding-block:calc(12px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));box-shadow:0 0 40px rgba(29,53,87,.25);background:linear-gradient(180deg,var(--sky) 0%,var(--sand) 100%);overflow-y:auto;animation:slidein .25s ease-out}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.checkin[hidden]{display:none}
.back{align-self:flex-start;margin-inline:12px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-size:14px}

.scene{position:relative;margin-inline:12px;aspect-ratio:360/220;max-width:100%;border-radius:18px;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 16px rgba(29,53,87,.18)}
.art,.art svg{display:block;width:100%;height:100%}
.art img.photo{display:block;width:100%;height:100%;object-fit:cover;background:#cfe8f6}
.stamp-layer{position:absolute;inset:0;pointer-events:none}
.stamp-layer>.stamp{position:absolute;left:50%;top:50%;width:46%;transform:translate(-50%,-50%)}
.stamp-layer .stamp{--paper:rgba(255,255,255,.88);filter:drop-shadow(0 3px 8px rgba(29,53,87,.3))}
.burst{position:absolute;inset:0;pointer-events:none;opacity:0;background:conic-gradient(from 0deg,transparent 0 8deg,rgba(255,220,110,.8) 8deg 12deg,transparent 12deg 30deg);-webkit-mask:radial-gradient(circle,transparent 18%,#000 22%,#000 46%,transparent 60%);mask:radial-gradient(circle,transparent 18%,#000 22%,#000 46%,transparent 60%)}
.burst.go{animation:burst .7s ease-out .22s both}
@keyframes burst{0%{opacity:0;transform:scale(.4) rotate(0)}30%{opacity:1}100%{opacity:0;transform:scale(1.5) rotate(25deg)}}
.slam{animation:slam .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes slam{0%{transform:translate(-50%,-50%) scale(2.6) rotate(-26deg);opacity:0}55%{transform:translate(-50%,-50%) scale(.88) rotate(-6deg);opacity:1}78%{transform:translate(-50%,-50%) scale(1.05) rotate(-9deg)}100%{transform:translate(-50%,-50%) scale(1) rotate(-8deg)}}
.shake{animation:shake .32s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}

.dialog{position:relative;margin:-34px 18px 0;background:rgba(255,255,255,.97);border:2.5px solid #ffb3a7;border-radius:16px;padding:16px 14px 12px 82px;min-height:84px;font-size:14.5px;line-height:1.55;box-shadow:0 6px 14px rgba(29,53,87,.12)}
.dialog p{margin:0}
.who{position:absolute;top:-13px;left:78px;background:var(--coral);color:#fff;border-radius:999px;padding:0 12px;font-size:13px;border:2px solid #fff}
.portrait{position:absolute;left:8px;bottom:8px;width:64px;height:64px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 8px rgba(29,53,87,.25);object-fit:cover}

.info{display:flex;flex-direction:column;gap:2px;padding-inline:16px}
.nm{font-size:19px;font-weight:700;line-height:1.3}
.sub{font-size:13px;opacity:.8}
.gps{font-size:12.5px;margin-top:4px;align-self:flex-start;background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:1px 10px}
.gps.far{background:#eef3f6;color:#4a5d68}

.actions{display:flex;gap:10px;align-items:center;padding-inline:14px}
.stampbtn{flex:1;min-height:50px;border:0;border-radius:999px;background:linear-gradient(180deg,#ff8a6a,#ff5e57);color:#fff!important;font-size:19px;letter-spacing:.12em;box-shadow:0 5px 0 var(--coral-d),0 10px 18px rgba(255,94,87,.3);transition:transform .1s,box-shadow .1s}
.stampbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-d)}
.stampbtn:disabled{background:#c9e9d6;color:var(--ok)!important;box-shadow:0 5px 0 #a4d4b8;cursor:default}
.stampbtn.locked:disabled{background:#e3e9ee;color:#5d7584!important;box-shadow:0 5px 0 #c9d4dc;font-size:15px;letter-spacing:.04em}
.reset{background:none;border:0;font-size:13px;text-decoration:underline;text-underline-offset:3px;opacity:.75;padding:8px 4px}
.tools{display:flex;gap:10px;padding-inline:14px}
.tool{flex:1;min-height:40px;border:2px solid var(--line);background:#fff;border-radius:999px;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tool:active{background:#eef8fb}
.tool:disabled{opacity:.6;cursor:default}
.tip{margin:0 16px;font-size:12.5px;color:#4a5d68;text-align:center}
.tip[hidden]{display:none}
/* 手機全寬：拿掉外框與左右留白（原本是置中的手機外框造型） */
.wrap{max-width:none;padding:0;gap:0}
.screen{border:0;border-radius:0;box-shadow:none;min-height:100vh;padding-block:12px 24px}
.checkin{max-width:none;box-shadow:none;background:linear-gradient(180deg,var(--t1,#e7f6ff) 0%,var(--sand) 100%)}
.tabs[hidden],.cards[hidden],.menu[hidden],.menubtn[hidden],.cloudform[hidden],.subsel[hidden]{display:none}
.subsel{padding-inline:12px}
.subsel select{width:100%;font:inherit;font-size:15px;color:var(--navy);background:#fff;border:2px solid var(--line);border-radius:999px;padding:7px 14px;appearance:auto}
.menubtn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:1px 10px;font-size:12.5px;white-space:nowrap}
.menu{display:flex;flex-direction:column;gap:10px;padding-inline:14px}
.menu-sum{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.7;color:#33474f}
.menu-sum b{font-size:22px;color:var(--coral);font-variant-numeric:tabular-nums}
.menu-sum small{display:block;color:#6a8396;font-size:11.5px}
.mbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 14px;text-align:left;box-shadow:0 3px 8px rgba(29,53,87,.08)}
.mbtn:active{background:#eef8fb}
.mbtn .ico{font-size:24px;line-height:1}
.mbtn b{display:block;font-size:16px;color:var(--navy)}
.mbtn small{display:block;font-size:11.5px;color:#6a8396;font-family:"Noto Sans TC",sans-serif}
.mbtn.main{background:linear-gradient(180deg,#ff8a6a,#ff5e57);border-color:#fff;box-shadow:0 5px 0 var(--coral-d),0 10px 18px rgba(255,94,87,.25)}
.mbtn.main b,.mbtn.main small{color:#fff}
.cloudform{display:flex;flex-direction:column;gap:8px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-family:"Noto Sans TC",sans-serif}
.cloudform h3{margin:0;font-size:15px;color:var(--navy)}
.cloudform p{margin:0;font-size:12px;color:#4a5d68;line-height:1.6}
.cloudform label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:700;color:var(--navy)}
.cloudform input{font:inherit;font-weight:400;font-size:15px;border:1.5px solid #bcd3df;border-radius:10px;padding:8px 10px}
.cloudform .row{display:flex;gap:8px}
.cloudform .row button{flex:1;min-height:42px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:15px}
.cloudform .row .ok{background:#17708a;border-color:#17708a;color:#fff!important}
.cloudform .row .ok:disabled{opacity:.6}
.menu-msg{margin:0;font-size:13px;text-align:center;color:#17594a;font-family:"Noto Sans TC",sans-serif}
.menu-msg.err{color:#c0392b}
.menu-msg:empty{display:none}

.book{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px}
.book h2{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;color:var(--c)}
.book h2 small{font-size:12px;color:var(--navy);opacity:.7;font-weight:400;font-variant-numeric:tabular-nums}
.book-empty{margin:0;padding:18px 8px;text-align:center;font-size:13.5px;color:#6a8396}
.slot .cap em{display:block;font-style:normal;font-size:10.5px;color:var(--sc)}
.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:4px 2px;border-radius:12px}
.slot[aria-pressed="true"]{background:#f3f9fd}
.slot .frame{width:100%;aspect-ratio:1;display:grid;place-items:center}
.slot .empty{width:86%;aspect-ratio:1;border:2.5px dashed #c9dbe6;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#8aa3b5}
.slot .empty.sq{border-radius:16%}
.slot .stamp{width:92%}
.slot .cap{font-size:11.5px;line-height:1.3;text-align:center;max-width:100%;overflow-wrap:anywhere}
.slot .cap i{display:block;font-style:normal;font-size:10.5px;color:var(--ok);font-variant-numeric:tabular-nums}

/* stamp: frame drawn in SVG, the bear logo inked through a mask in the category colour */
.stamp{position:relative;aspect-ratio:1;color:var(--c)}
.stamp svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stamp .bear{position:absolute;left:35%;top:29.2%;width:30%;height:30%;background:var(--bear) center/contain no-repeat}


@media (prefers-reduced-motion: reduce){.slam,.burst.go,.shake,.checkin{animation:none!important}}

<script>
const GOV_ACT = { "文化局": "2027超級龜龜" };
function lxText(o){
  const yr = v => { const m = v.match(/^(\d{3,4})\/(\d{1,2})\/(\d{1,2})$/); if(!m) return v; let y=+m[1]; if(y<1911) y+=1911; return y+"/"+m[2].padStart(2,"0")+"/"+m[3].padStart(2,"0"); };
  const DATE = /(\d{3,4}\/\d{1,2}\/\d{1,2})/g;
  const headRe = /^\s*((?:\d{3,4}\/\d{1,2}\/\d{1,2}\s*(?:(?:-|－|至|到)\s*\d{3,4}\/\d{1,2}\/\d{1,2})?\s*)*)((?:週[一二三四五六日](?:、週[一二三四五六日])*\s*)?)((?:\d{1,2}[:：]\d{2}(?:\s*[-－]\s*\d{1,2}[:：]\d{2})?)?)\s*(.*)$/;
  const parts = String(o["元宵活動內容"]||"").split(/[、|｜│]/).map(x=>x.trim()).filter(Boolean);
  const items = []; let buf = "";
  parts.forEach(p => { const cur = buf ? buf+"、"+p : p; const m = cur.match(headRe); if (m && m[4].trim()) { items.push(cur); buf = ""; } else buf = cur; });
  if (buf) items.push(buf);
  const base = (String(o["元宵活動日期範圍(YYYY/MM/DD-YYYY/MM/DD)"]||"").match(DATE)||[]).map(yr).sort();
  const govs = String(o["參加政府單位活動(澎管處、文化局)"]||"").split(/[、,，|｜│]/).map(x=>x.trim()).filter(Boolean).map(x => { const m = x.match(/^([^-－]+)[-－](.+)$/); return m ? m[1].trim()+"-"+m[2].trim() : (GOV_ACT[x] ? x+"-"+GOV_ACT[x] : x); });
  const govActs = govs.map(g => g.split("-").slice(1).join("-")).filter(Boolean);
  const rows = items.map((it,i) => { const m = it.match(headRe); const ds = (m[1].match(DATE)||[]).map(yr).sort(); const tm = (m[3]||"").replace(/：/g,":");
    const label = [m[1].trim().replace(/\d{3,4}\//g,"").replace(/\s+/g,""), m[2].trim(), tm.replace(/\s+/g,""), m[4].trim()].filter(Boolean).join(" ");
    return { name: m[4].trim(), label, k: [ds[0]||base[0]||"", tm.split("-")[0]||"", ds[ds.length-1]||base[base.length-1]||""], i }; })
    .filter(r => !govActs.includes(r.name))
    .sort((a,b) => { for (let k=0;k<3;k++) if (a.k[k]!==b.k[k]) return a.k[k]<b.k[k]?-1:1; return a.i-b.i; });
  const all = [...base, ...rows.flatMap(r=>[r.k[0], r.k[2]])].filter(Boolean).sort(), a = all[0]||"", b = all[all.length-1]||"";
  const range = !a ? "" : a===b ? a : a+"-"+b;
  return { acts: rows.map(r=>r.label).join("\n"), gov: govs.join("\n"), range };
}

  /* 餐別（早餐／午餐／晚餐／宵夜／素食）只看「類別」欄；飲品、下午茶看主類別＋類別；海鮮另外看代表餐食與店名 */
  function foodMatch(p, opt){
    const split = s => String(s || "").split(/[／/、,，;；\s]+/).map(v=>v.trim()).filter(Boolean);
    const cat2 = split(p.cat2), kinds = split(p.kinds);
    if(["早餐","午餐","晚餐"].includes(opt)) return cat2.some(x => x === opt || (/^[早午晚]+餐$/.test(x) && x.includes(opt[0])));
    if(opt === "宵夜") return cat2.some(x => /宵夜|消夜/.test(x));
    if(opt === "素食") return cat2.some(x => /素/.test(x));
    if(opt === "飲品") return kinds.some(x => /飲品|飲料|手搖|茶飲/.test(x));
    if(opt === "下午茶") return kinds.some(x => /下午茶/.test(x));
    if(opt === "海鮮") return kinds.some(x => /海鮮|海產/.test(x)) || /海鮮|海產/.test(p.extra + " " + p.name);
    return true;
  }
  const DEITY_ALIASES = [
    ["玄天上帝", ["玄天上帝","真武大帝","上帝公","北極大帝","玄天大帝"]],
    ["關聖帝君", ["關聖帝君","文衡聖帝","文衡關聖帝君","關公","關帝","五天聖帝","恩主公"]],
    ["觀世音菩薩", ["觀世音菩薩","觀音佛祖","觀音菩薩","南海觀世音菩薩","觀音","觀音大士","觀世音"]],
    ["天上聖母", ["天上聖母","媽祖","天后","天妃","媽祖娘娘"]],
    ["福德正神", ["福德正神","土地公","伯公"]],
    ["中壇元帥", ["中壇元帥","哪吒三太子","哪吒太子","三太子","中壇元帥三太子","太子爺"]],
    ["玉皇大帝", ["玉皇大帝","玉皇大天尊","天公"]],
    ["城隍", ["城隍","城隍尊神","城隍爺"]],
    ["釋迦牟尼佛", ["釋迦牟尼佛","釋迦佛"]]
  ];
  function deityName(raw){
    let s = String(raw || "").replace(/\s/g, "");
    if(!s) return "";
    const inParen = (s.match(/[（(]([^）)]+)[）)]/) || [])[1] || "";
    for(const [main, names] of DEITY_ALIASES){
      if(names.includes(s) || (inParen && names.includes(inParen)) || names.includes(s.replace(/[（(].*$/, ""))) return main;
    }
    const wang = s.match(/^([^府王千]{1})府?(王爺|千歲)$/) || s.match(/^([^府王千]{1})王$/);   /* 朱王爺、朱府千歲 → 朱府王爺 */
    if(wang && wang[1] !== "諸") return wang[1] + "府王爺";
    return s;
  }
  function deityGroups(raw){
    return [...new Set(String(raw || "").split(/[、／/,，;；]+/).map(deityName).filter(Boolean))];
  }
  function subOptions(catKey){
    if(catKey === "food") return FOOD_OPTS.map(o => [o, o, PLACES.food.filter(p=>foodMatch(p, o)).length]).filter(x => x[2] > 0);
    if(catKey === "temple"){
      const count = {};
      PLACES.temple.forEach(p => (p.gods || []).forEach(g => { count[g] = (count[g] || 0) + 1; }));
      return Object.entries(count).sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh-Hant")).map(([g, n]) => [g, g, n]);
    }
    return [];
  }
  function subMatch(catKey, p, val){
    if(!val) return true;
    if(catKey === "food") return foodMatch(p, val);
    if(catKey === "temple") return (p.gods || []).includes(val);
    return true;
  }
  function buildPlaces(catKey, table){
    const seen = {};
    return toObjects(table).map(o=>{
      const p = BUILD[catKey](o); if(!p) return null;
      const lat = parseFloat(String(o.Latitude||"").replace(/,/g,"")), lng = parseFloat(String(o.Longitude||"").replace(/,/g,""));
      if(Number.isFinite(lat) && Number.isFinite(lng)){ p.lat = lat; p.lng = lng; }
      p.area = areaOf(o, p);
      if(catKey === "food"){ p.cat2 = o["類別"] || ""; p.kinds = [o["主類別"], o["類別"]].filter(Boolean).join("／"); p.extra = o["代表餐食／服務"] || ""; }
      if(catKey === "temple") p.gods = deityGroups(o["主祀"]);
      return p;
    }).filter(Boolean).map(p=>{
      let id = catKey + ":" + p.name + "|" + p.key;
      seen[id] = (seen[id]||0) + 1; if(seen[id] > 1) id += "#" + seen[id];
      return Object.assign(p, { id, bar: BARS[hash(p.tag||p.name) % BARS.length] });
    });
  }

  let picDb = null;
  function openPicDb(){
    if(!picDb) picDb = new Promise((ok, no) => {
      try{
        const r = indexedDB.open("lanternStamp", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("pics");
        r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
      }catch(e){ no(e); }
    });
    return picDb;
  }
  async function picPut(id, blob){
    const db = await openPicDb();
    await new Promise((ok, no) => { const tx = db.transaction("pics", "readwrite"); tx.objectStore("pics").put(blob, id); tx.oncomplete = ok; tx.onerror = () => no(tx.error); });
  }
  async function picAll(){
    const db = await openPicDb();
    return new Promise((ok, no) => {
      const out = {}, req = db.transaction("pics").objectStore("pics").openCursor();
      req.onsuccess = () => { const c = req.result; if(c){ out[c.key] = c.value; c.continue(); } else ok(out); };
      req.onerror = () => no(req.error);
    });
  }
  /* 照片縮到長邊 1600px 再保存，避免佔用太多手機空間；無法解碼時保存原檔 */
  async function shrinkPic(file){
    try{
      const url = URL.createObjectURL(file);
      const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
      URL.revokeObjectURL(url);
      const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
      const cv = document.createElement("canvas"); cv.width = Math.round(im.naturalWidth*k); cv.height = Math.round(im.naturalHeight*k);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      const blob = await new Promise(ok => cv.toBlob(ok, "image/jpeg", 0.85));
      return blob || file;
    }catch(e){ return file; }
  }
  Object.keys(SHEETS).forEach(k=>{ PLACES[k] = buildPlaces(k, SNAPSHOT[k]); });

      const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), 10000);
      try{
        const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
        if(!res.ok) throw new Error(res.status);
        const list = buildPlaces(k, parseCSV(await res.text()));
        if(list.length) PLACES[k] = list;
      }catch(e){ /* keep the snapshot for this tab */ }
      finally{ clearTimeout(t); }
    };
    await Promise.all(Object.keys(SHEETS).map(one));

  function stampHTML(catKey, place){

  async function prepareShare(){
    const p = st.open ? place() : null, catKey = st.openCat;
    st.shareFile = null;
    if(!p || !st.done[p.id]){ dlBtnState(); return; }
    const job = ++shareJob;
    dlBtnState();
    try{
      const file = await buildShareFile(p, catKey);
      if(job !== shareJob || st.open !== p.id) return;
      st.shareFile = { id: p.id, file };
    }catch(e){
      if(job === shareJob) tip("圖片產生失敗，請重新開啟這個地點再試一次");
    }
    if(job === shareJob) dlBtnState();
  }
  function shareScene(){
    const p = place(), s = st.shareFile;
    if(!p || !st.done[p.id] || !s || s.id !== p.id) return;
    const nav = shareNav();
    const data = { files: [s.file], title: "元宵集章卡", text: p.name };
    let can = false;
    try{ can = !!(nav.canShare && nav.canShare({ files: [s.file] })); }catch(e){}
    if(can){
      /* 按下按鈕的當下直接呼叫分享（不再等待產圖），手機才會開分享選單 */
      nav.share(data).then(()=>tip("")).catch(e=>{
        if(e && e.name === "AbortError") tip("已取消分享");
        else tip("無法開啟分享選單（" + (e && e.name || "錯誤") + "），已改為下載圖片"), saveFile(s.file);
      });
    } else {
      saveFile(s.file);
      tip("這支手機不支援分享，已改為下載圖片");
    }
  }
  function saveFile(file){
    const url = URL.createObjectURL(file), a = document.createElement("a");
    a.href = url; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
  }
  async function changePic(file){
    const p = place(); if(!p || !file || !/^image\//.test(file.type)) return;
    const id = p.id, blob = await shrinkPic(file);
    if(st.pics[id]) URL.revokeObjectURL(st.pics[id]);
    st.pics[id] = URL.createObjectURL(blob);
    if(st.open === id){ showArt(p, st.openCat, st.open); prepareShare(); }
    try{ await picPut(id, blob); tip("已更換圖片（已保存在這支手機）"); }
    catch(e){ tip("已更換圖片（這個環境無法保存，重新開啟後會恢復原圖）"); }
  }
  function stampBtn(){
    const has = !!st.done[st.open], btn = $(".stampbtn"), p = st.open ? place() : null;
    const lock = (!has && p) ? stampLock(p) : "";
    btn.textContent = has ? "已蓋章 ✓" : (lock || "蓋章！"); btn.disabled = has || !!lock;
    btn.classList.toggle("locked", !!lock);
  }

  /* ---------- 中間介面：開啟景點／儲存紀錄／雲端儲存／雲端載入 ---------- */
  const DEVICE_KEY = "lanternStamp.device", PROFILE_KEY = "lanternStamp.profile";
  function deviceId(){
    try{
      let id = localStorage.getItem(DEVICE_KEY);
      if(!id){ id = "LF-" + Array.from(crypto.getRandomValues(new Uint8Array(4)), b=>b.toString(16).padStart(2,"0")).join("").toUpperCase(); localStorage.setItem(DEVICE_KEY, id); }
      return id;
    }catch(e){ return ""; }
  }
  function menuMsg(text, err){ const m = $(".menu-msg"); m.textContent = text || ""; m.classList.toggle("err", !!err); }
  function renderMenu(){
    const ids = Object.keys(st.done), dates = ids.map(id=>st.done[id]).sort();
    $(".menu-count").textContent = ids.length;
    $(".menu-first").textContent = dates.length ? "第一次集章：" + dates[0] : "還沒有蓋章紀錄";
    const dev = deviceId(); let ver = "";
    try{ ver = (window.parent && typeof window.parent.appVersion === "function") ? window.parent.appVersion() : ""; }catch(e){}
    $(".menu-dev").textContent = [dev ? "裝置代號：" + dev : "", ver ? "版本：" + ver : ""].filter(Boolean).join("　");
  }
  function showScreen(name, fromPop){
    if(!fromPop){
      if(name === "list" && st.screen !== "list" && !st.listHist && appHist()){ try{ history.pushState({ stampList: 1 }, ""); st.listHist = true; }catch(e){} }
      else if(name === "menu" && st.listHist){ st.listHist = false; st.skipPop = true; try{ history.back(); }catch(e){ st.skipPop = false; } }
    }
    st.screen = name;
    const isMenu = name === "menu";
    $(".menu").hidden = !isMenu; $(".tabs").hidden = isMenu; $(".cards").hidden = isMenu; $("#btn-menu").hidden = isMenu;
    if(isMenu) $(".subsel").hidden = true;
    if(isMenu){ renderMenu(); } else { menuMsg(""); render(); }
    try{ window.scrollTo(0, 0); }catch(e){}
  }
  const cloudUrl = () => { try{ return (window.parent && typeof window.parent.stampCloudUrl === "function" && window.parent.stampCloudUrl()) || ""; }catch(e){ return ""; } };
  let cloudMode = "";
  function openCloudForm(mode){
    cloudMode = mode; menuMsg("");
    const f = $(".cloudform"), n = Object.keys(st.done).length;
    $(".cf-title").textContent = mode === "save" ? "☁️ 雲端儲存" : "📥 雲端載入";
    $(".cf-note").textContent = mode === "save"
      ? `將這支手機的 ${n} 個章存到雲端（與雲端原有紀錄合併，同一個章保留最早的蓋章日期）。`
      : "輸入當初雲端儲存時的姓名、手機、Email，載入後會與這支手機的紀錄合併。";
    try{ const p = JSON.parse(localStorage.getItem(PROFILE_KEY) || "{}"); ["name","phone","mail"].forEach(k=>{ if(p[k] && !f.elements[k].value) f.elements[k].value = p[k]; }); }catch(e){}
    f.hidden = false; f.elements.name.focus();
  }
  function closeCloudForm(){ $(".cloudform").hidden = true; cloudMode = ""; }
  async function submitCloud(){
    const f = $(".cloudform");
    const name = f.elements.name.value.trim(), phone = f.elements.phone.value.replace(/\D/g,""), mail = f.elements.mail.value.trim().toLowerCase();
    if(!name) return menuMsg("請輸入姓名", true);
    if(phone.length < 8) return menuMsg("請輸入正確的手機號碼", true);
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return menuMsg("請輸入正確的 Email", true);
    const url = cloudUrl();
    if(!url) return menuMsg("尚未設定雲端網址（試算表「系統設定」的「集章雲端網址」）", true);
    try{ localStorage.setItem(PROFILE_KEY, JSON.stringify({ name, phone, mail })); }catch(e){}
    const ok = $(".cf-ok"); ok.disabled = true; menuMsg(cloudMode === "save" ? "正在存到雲端…" : "正在從雲端載入…");
    try{
      const payload = { action: cloudMode === "save" ? "save" : "load", name, phone, mail, device: deviceId() };
      if(cloudMode === "save") payload.done = st.done;
      const res = await fetch(url, { method:"POST", body: JSON.stringify(payload) });
      const data = await res.json();
      if(!data.ok) throw new Error(data.error || "雲端回應錯誤");
      if(cloudMode === "save"){
        closeCloudForm(); menuMsg(`✅ 已存到雲端，雲端共 ${data.count} 個章`);
      } else {
        let added = 0;
        Object.entries(data.done || {}).forEach(([id, date])=>{ if(!st.done[id] || String(date) < String(st.done[id])){ if(!st.done[id]) added++; st.done[id] = String(date); } });
        saveDone(); closeCloudForm(); renderMenu();
        menuMsg(`✅ 已載入雲端紀錄（雲端 ${data.count} 個章，新增 ${added} 個），目前共 ${Object.keys(st.done).length} 個章`);
      }
    }catch(e){
      menuMsg("⚠️ " + (e && e.message ? e.message : "連線失敗，請確認網路後再試"), true);
    }finally{ ok.disabled = false; }
  }
  $(".menu").addEventListener("click", e=>{
    const b = e.target.closest("[data-act]"); if(!b) return;
    const act = b.dataset.act;
    if(act === "list"){ closeCloudForm(); showScreen("list"); }
    else if(act === "save"){ closeCloudForm(); saveDone(); renderMenu(); menuMsg(`✅ 已將 ${Object.keys(st.done).length} 個章的紀錄存進這支手機`); }
    else openCloudForm(act === "cloud-save" ? "save" : "load");
  });
  $(".cf-cancel").addEventListener("click", ()=>{ closeCloudForm(); menuMsg(""); });
  $(".cloudform").addEventListener("submit", e=>{ e.preventDefault(); submitCloud(); });
  $("#btn-menu").addEventListener("click", ()=>showScreen("menu"));

  $("#sub-sel").addEventListener("change", e=>{ st.sub = st.sub || {}; st.sub[st.cat] = e.target.value; shown = 0; render(); try{ window.scrollTo(0, 0); }catch(err){} });
  $(".tabs").addEventListener("click", e=>{ const b=e.target.closest("button[data-c]"); if(!b) return; if(st.cat!==b.dataset.c) shown = 0; st.cat=b.dataset.c; render(); });
  $(".cards").addEventListener("click", e=>{ if(e.target.closest("a.nav")) return; const b=e.target.closest("[data-id]"); if(b) openCheckin(b.dataset.id, b.dataset.c || st.cat); });
  $("#btn-back").addEventListener("click", closeCheckin);
  window.addEventListener("popstate", ()=>{
    if(st.skipPop){ st.skipPop = false; return; }
    if(st.hist && st.open){ st.hist = false; closeCheckin(); return; }
    st.hist = false;
    if(st.listHist && st.screen === "list"){ st.listHist = false; showScreen("menu", true); }
  });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && st.open) closeCheckin(); });
  $(".stampbtn").addEventListener("click", ()=>{
    const p = place(); if(!p || st.done[p.id] || stampLock(p)) return;
    st.done[p.id] = nowStamp(); saveDone();
    const layer = $(".stamp-layer");
    layer.innerHTML = stampHTML(st.openCat,p);
    layer.firstElementChild.classList.add("slam");
    const burst = $(".burst"), sc = $(".scene");
    burst.classList.remove("go"); sc.classList.remove("shake"); void burst.offsetWidth;
    burst.classList.add("go");
    $(".stampbtn").disabled = true;
    setTimeout(()=>sc.classList.add("shake"), 240);
    setTimeout(()=>{ sc.classList.remove("shake"); stampBtn(); render(); prepareShare(); }, 900);
  });
  $("#btn-dl").addEventListener("click", shareScene);
  $("#btn-pic").addEventListener("click", ()=>$("#pic-file").click());
  $("#pic-file").addEventListener("change", e=>{ changePic(e.target.files[0]); e.target.value = ""; });
  $(".reset").addEventListener("click", ()=>{ st.done = {}; saveDone(); $(".stamp-layer").innerHTML = ""; stampBtn(); render(); prepareShare(); });
  render();
  showScreen("menu");
  loadLive().then(()=>{ render(); if(st.screen === "menu") renderMenu(); });
  /* 讀回這支手機保存過的更換圖片 */
  picAll().then(saved => {
    Object.entries(saved).forEach(([id, blob]) => { if(blob && !st.pics[id]) st.pics[id] = URL.createObjectURL(blob); });
    if(st.open){ const p = place(); if(p && saved[p.id]) showArt(p, st.openCat, st.open); }
  }).catch(()=>{});
  /* 開啟集章卡時取得一次位置，用來把清單排成由近到遠 */
  if("geolocation" in navigator){
    navigator.geolocation.getCurrentPosition(pos=>{
      const first = !lastPos;
      lastPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if(first && !st.open && st.cat !== "book") render();
    }, ()=>{}, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  }
})();
</script>

</html>
